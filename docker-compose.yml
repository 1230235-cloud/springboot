services:

  app:
    build:
      context: ./app
      dockerfile: ../Dockerfile
    image: practica-springboot:latest
    container_name: springboot_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/cake_db
      SPRING_DATASOURCE_USERNAME: cake_user
      SPRING_DATASOURCE_PASSWORD: cake_password
    depends_on:
      - db
    networks:
      - red-laboratorio
    restart: unless-stopped

  db:
    image: mariadb:11.4
    container_name: mariadb_db
    environment:
      MYSQL_ROOT_PASSWORD: secret_root_pass
      MYSQL_DATABASE: cake_db
      MYSQL_USER: cake_user
      MYSQL_PASSWORD: cake_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - red-laboratorio
    restart: unless-stopped

networks:
  red-laboratorio:
    driver: bridge

volumes:
  db_data:
